@if(lat == null || lng == null) {
    <p class="text-2xl">no point selected</p>
} 
@else {
    <p class="text-3xl">
        {{getAbs(lat)}}
        <direction-span [direction]="getSign(lat)" 
                        positiveText="N" 
                        negativeText="S" 
                        positiveColor="blue" 
                        negativeColor="red">
        </direction-span>

        {{getAbs(lng)}}
        <direction-span [direction]="getSign(lng)" 
                        positiveText="E" 
                        negativeText="W" 
                        positiveColor="yellow" 
                        negativeColor="cyan">
        </direction-span>
    </p>
    <div class="border-2 border-gray-400"></div>
}
